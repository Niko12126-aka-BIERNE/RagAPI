services:

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  llama-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["local"]
    ports:
      - "8080:8080"
    volumes:
      - ./RagAPI/GgufModels:/models
    command: >
      --model /models/qwen3-8b-q4_k_m.gguf
      --port 8080
      --host 0.0.0.0
      --ctx-size 4096
      --parallel 2
    restart: unless-stopped

  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    ports:
      - "8081:8081"
    volumes:
      - ./RagAPI/GgufModels:/models
    command: >
      --model /models/qwen3-embedding-4b-q4_k_m.gguf
      --port 8081
      --host 0.0.0.0
      --ctx-size 4096
      --embedding
      --parallel 4
    restart: unless-stopped

  llama-vision:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["local"]
    ports:
      - "8082:8082"
    volumes:
      - ./RagAPI/GgufModels:/models
    command: >
      --model /models/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      --mmproj /models/mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
      --port 8082
      --host 0.0.0.0
      --ctx-size 4096
    restart: unless-stopped

  ragapi:
    build:
      context: .
      dockerfile: RagAPI/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - RagConfigurations__AnthropicApiKey=${ANTHROPIC_API_KEY}
    depends_on:
      - qdrant
      - llama-embed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s